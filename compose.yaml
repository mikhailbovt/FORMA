name: forma-smart-resume-builder

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forma}
      POSTGRES_USER: ${POSTGRES_USER:-forma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forma}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - forma

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-forma}:${POSTGRES_PASSWORD:-forma}@postgres:5432/${POSTGRES_DB:-forma}?sslmode=disable
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      AI_SESSION_TTL: ${AI_SESSION_TTL:-30m}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-2097152}
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "/forma-api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - forma

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - forma

volumes:
  postgres_data:

networks:
  forma:
    driver: bridge
