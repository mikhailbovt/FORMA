name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test --if-present

      - name: Build frontend
        run: npm run build

      - name: Verify Sites package
        run: npm run test:sites --if-present

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: test -z "$(find . -type f -name '*.go' -exec gofmt -l {} +)"

      - name: Vet backend
        run: go vet ./...

      - name: Test backend
        run: go test ./...

      - name: Build backend
        run: go build -o /tmp/forma-api ./cmd/api

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose model
        run: docker compose config --quiet

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    needs: [frontend, backend, compose]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application images
        run: docker compose build
